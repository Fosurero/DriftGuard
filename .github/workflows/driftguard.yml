name: DriftGuard

on:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DriftGuard
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run scan
        run: |
          driftguard scan . --chain base --format md --output driftguard_report.md || true

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: driftguard-report
          path: driftguard_report.md

      - name: TODO PR comment
        run: |
          echo "TODO: Add optional PR comment posting logic with permissions + GH token."
